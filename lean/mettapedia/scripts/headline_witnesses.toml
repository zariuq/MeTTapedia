# Headline theorems and the declarations that witness their hypotheses.
#
# Checked by `python3 scripts/check_headline_witnesses.py` (static) and
# `python3 scripts/check_headline_witnesses.py --lean` (from the compiled declarations).
#
# [[witness]]
#   `witness` applies `theorem` with every hypothesis argument closed, either directly or
#   through the proof of a theorem it applies; so the hypotheses of `theorem` hold together.
#   `witness_module` declares the witness and imports `theorem_module`.
#
# [[refutation]]
#   A negative control: a closed statement, or a theorem with conclusion `False`, saying
#   that a hypothesis combination never holds.
#
# [[vacuous]]
#   A theorem whose hypotheses never hold together, kept on purpose, with the `reason`.
#   `--audit` fails on a theorem whose proof derives `False` from its hypotheses unless it
#   is acknowledged here.

